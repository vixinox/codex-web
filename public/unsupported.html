<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>暂不支持移动端访问 - Codex Web</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #1f2937;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 3rem 1.5rem;
        text-align: center;
      }

      .content {
        display: flex;
        width: min(100%, 24rem);
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .logo {
        width: 3rem;
        height: 3rem;
      }

      .icon {
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        border-radius: 999px;
        background: #e8ebf0;
        color: #667085;
        font-size: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.5;
      }

      p {
        margin: 0.5rem 0 0;
        color: #667085;
        font-size: 0.9375rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        background: #1f2937;
        padding: 0.625rem 1rem;
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 500;
        text-decoration: none;
      }

      a:hover {
        background: #374151;
      }

      a:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="content">
        <img class="logo" src="/codex.svg" alt="Codex Web" />
        <div class="icon" aria-hidden="true">&#x1F5A5;</div>
        <div>
          <h1>暂不支持移动端访问</h1>
          <p>请使用桌面浏览器访问 Codex Web。</p>
        </div>
        <a id="continue" href="/">仍要继续</a>
      </div>
    </main>
    <script>
      document.getElementById('continue').addEventListener('click', (event) => {
        event.preventDefault()
        document.cookie = 'codex_web_desktop=1; Path=/; SameSite=Lax'
        try {
          window.localStorage.setItem('codex_web_desktop', '1')
        } catch {
          // The cookie still provides an escape hatch when storage is unavailable.
        }
        window.location.replace('/')
      })
    </script>
  </body>
</html>
