services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: codex_web
      POSTGRES_USER: codex_web
      POSTGRES_PASSWORD: codex_web
    ports:
      - "5433:5432"
    volumes:
      - codex-web-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_web -d codex_web"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  codex-web-postgres:
