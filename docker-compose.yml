services:
  postgres:
    container_name: codex-web-postgres
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: codex_web
      POSTGRES_USER: codex_web
      POSTGRES_PASSWORD: codex_web
    volumes:
      - codex-web-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_web -d codex_web"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  codex-web-postgres:
